<script type="text/javascript">
  window.trinketSandboxConfig = {
    subdomain  : '{{config.sandbox.url.serverSubdomain}}'
    , domain   : '{{config.sandbox.url.domain}}'
    , protocol : '{{config.sandbox.url.protocol}}'
    , mode     : '{{config.sandbox.mode or "local"}}'
    , localPermissions : '{{config.sandbox.local.permissions or "allow-scripts allow-forms allow-modals allow-popups"}}'
    , assetsEnabled : {{ 'true' if config.features.assets else 'false' }}
  };
  // Mirrors lib/util/stringUtils.addPrefix, which every other asset URL goes
  // through: an explicit prefix wins, otherwise fall back to the deploy-scoped
  // cache-prefix. Emitting nothing (the old behaviour) sent the runner to bare
  // paths, which the app serves `no-store` and Firebase Hosting serves with a
  // 5-minute TTL — so a 4.2 MB glow.min.js was re-fetched all through a class.
  var prefix = '{% if config.app.prefixes.components %}{{config.app.prefixes.components}}/{% else %}cache-prefix-{{ componentsToken() }}/{% endif %}';
  window.trinketAppConfig = {
    url     : '{{config.url}}',
    domain  : '{{config.app.url.hostname}}',
    prefix  : prefix,
    version : '{{config.app.glowscript.blocksVersion}}',
    versionMap : {
        '1.1' : {
            'trinket'    : '1.1.3'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/1.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/1.1/jquery-ui.custom.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/1.1/jquery.ui.touch-punch.min.js' ]
        }
      , '2.0' : {
            'trinket'    : '2.0.1'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.0/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.0/jquery-ui.custom.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.0/jquery.ui.touch-punch.min.js' ]
        }
      , '2.1' : {
            'trinket'    : '2.1.1'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery-ui.custom.min.js' ]
        }
      , '2.3' : {
            'trinket'    : '2.3.1'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery-ui.custom.min.js' ]
        }
      , '2.5' : {
            'trinket'    : '2.5.1'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery-ui.custom.min.js' ]
      }
      , '2.6' : {
            'trinket'    : '2.6.2'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery-ui.custom.min.js' ]
      }
      , '2.7' : {
            'trinket'    : '2.7.5'
          , 'path'       : 'glowscript'
          , 'jquerySrcs' : [ '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery.min.js',
                             '{{config.url}}/' + prefix + 'components/glowscript/lib/jquery/2.1/jquery-ui.custom.min.js' ]
      }
    }
  };
</script>
