name: tests

on:
  push:
  pull_request:
  # Allow re-running the suite on demand (e.g. to confirm a failure was an
  # infra stall rather than a real regression) without pushing an empty commit.
  workflow_dispatch:

jobs:
  # Pure-Python unit tests, on their own job so the interpreter matrix does not
  # cross-multiply with the database backends below (2 x 2 legs of the full JS
  # suite for no gain).
  #
  # 3.13 is what Pyodide 0.28.1 ships to students today; 3.14 is where Pyodide
  # is heading once #215 lifts the classic-worker cap. The AST work in
  # _trinket_display.py is the version-sensitive part of the typeset math
  # feature, so both are checked from the start rather than retrofitted after a
  # bump breaks something.
  python-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    name: python (${{ matrix.python-version }})
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python --version

      - name: trinket display hook tests (python, no deps)
        run: python test/lib/embed/test_trinket_display.py

  test:
    runs-on: ubuntu-latest
    # Run the SAME suite on both database backends. Mongo is lenient about
    # undefined query values (`.where(f, '==', undefined)` is ignored); Firestore
    # — the backend Cloud Run actually deploys — throws. Mongo-only CI let a
    # slug-alias-redirect regression ship green while it 500'd every New Trinket
    # on Firestore. The Firestore profile makes that whole class loud in CI.
    strategy:
      fail-fast: false
      matrix:
        backend: [mongo, firestore]
    name: test (${{ matrix.backend }})
    # Without a timeout a stalled dependency download hangs the leg for the
    # 6h default instead of failing fast. Observed repeatedly: one leg sitting
    # at 15m+ (normal run is ~1-3m) and being cancelled, with the other leg
    # green — i.e. an infra stall, never an assertion failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: vpython async-transform tests (python, no deps)
        if: matrix.backend == 'mongo'
        run: python3 test/lib/wvpython/test_async_transform.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: node --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # --- Mongo profile only: cache the mongod binary ---
      # mongodb-memory-server downloads mongod (~100MB, fastdl.mongodb.org) on
      # every fresh runner; `cache: 'npm'` above does NOT cover it. That
      # uncached third-party download is the mongo leg's flaky step. Keyed to
      # the pinned version in test/helpers/mongo-global.mjs — bump it there and
      # the key changes, so the cache can't go stale.
      - name: Cache mongod binary
        if: matrix.backend == 'mongo'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-6.0.14

      # --- Firestore profile only: run the standalone Firestore emulator jar ---
      # (same jar and invocation as test/firestore-emulator.Dockerfile).
      - name: Set up JDK (Firestore emulator)
        if: matrix.backend == 'firestore'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Same rationale as the mongod cache: the emulator jar was re-downloaded
      # from storage.googleapis.com on every run. Keyed to the pinned version.
      - name: Cache Firestore emulator jar
        if: matrix.backend == 'firestore'
        uses: actions/cache@v4
        with:
          path: /tmp/firestore.jar
          key: firestore-emulator-v1.19.8

      - name: Start Firestore emulator
        if: matrix.backend == 'firestore'
        run: |
          # Only download on a cache miss, and make that fallback resilient:
          # --retry rides out a transient stall instead of hanging, and
          # --max-time bounds the attempt so the job timeout is never the
          # thing that catches it.
          if [ ! -s /tmp/firestore.jar ]; then
            curl -sSL --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 \
              -o /tmp/firestore.jar \
              https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar
          fi
          java -jar /tmp/firestore.jar --host 127.0.0.1 --port 8089 &
          for i in $(seq 1 60); do
            curl -s 127.0.0.1:8089 >/dev/null && break
            sleep 1
          done
          curl -s 127.0.0.1:8089 >/dev/null || { echo "Firestore emulator did not start"; exit 1; }

      - name: Run tests (mongo)
        if: matrix.backend == 'mongo'
        run: npm test

      # The Firestore profile flips the backend at module load (see
      # test/helpers/vitest-setup.cjs) and can't share Firestore across parallel
      # files, so it runs serially.
      - name: Run tests (firestore)
        if: matrix.backend == 'firestore'
        env:
          TEST_DB_BACKEND: firestore
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
          GOOGLE_CLOUD_PROJECT: demo-trinket
        run: npx vitest run --fileParallelism=false
