      - '//cdnjs.cloudflare.com/ajax/libs/angular-ui-tree/2.22.6/angular-ui-tree.min.js'
      - '/components/angular-scrollfix.js'
      - '//cdnjs.cloudflare.com/ajax/libs/angular-xeditable/0.1.8/js/xeditable.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/angular-file-saver/1.1.3/angular-file-saver.bundle.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/angular.js/1.3.20/angular-animate.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/angular-foundation/0.8.0/mm-foundation-tpls.min.js'
      - '/partials/directives/trinket-calendar.js'
