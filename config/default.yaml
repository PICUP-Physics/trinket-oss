  extensionWhitelist:
    ipynb: 'text/plain'
  autorun:
    - python
    - glowscript
    - blocks
    - python3
    - pyodide
    - java
    - glowscript-blocks
    - R
  outputOnly:
    - python
    - html
    - glowscript
    - blocks
    - python3
    - pyodide
    - pygame
    - java
    - glowscript-blocks
    - R
  toggleCode:
    - python
    - html
    - glowscript
    - blocks
    - python3
    - pyodide
    - pygame
    - java
    - glowscript-blocks
    - R
  toggleEditor:
    - pygame
  downloadable:
    - python
    - html
    - python3
    - pyodide
    - pygame
    - java
    - blocks
    - glowscript-blocks
    - R
    - pygame
  uploadable:
    - blocks
    - glowscript-blocks
  configurable:
    - python
    - pygame
    - python3
    - pyodide
    - R
    - glowscript
    - html
    - java
  nodraft:
    - console
  notShareable:
    - pygame
  hideGeneratedCode:
    - blocks
    - glowscript-blocks
  # Trinket types whose embed honours ?runtime= (#108). Only the Pyodide-backed
  # embed consults the runtime router; skulpt `python`, glowscript, java, html,
  # blocks, music and R ignore the parameter entirely, so the share dialog must
  # not offer a runtime choice for them.
  runtimeOption:
    - python3
    - pyodide
  # Trinket types that support the calculator layout (runMode=calculator): the
  # output front and centre with the code behind a toggle. Implemented in the
  # glowscript embed only (lib/views/embed/glowscript.html, public/js/embed/
  # glowscript.js), so the share dialog offers it there and nowhere else.
  calculatorOption:
    - glowscript
  runOption:
    python:
      - run
      - console
    python3:
      - run
      - console
    pyodide:
      - run
      - console
    R:
      - run
      - console
  glowscript:
    defaultVersion: '3.2'
    blocksVersion: '2.7'
  embed:
    proxy: 'http://127.0.0.1/proxy'
    skulpt:
      local: false # when true pulls from bower install instead of cdn
      min: false # when true uses minified local copy of skulpt core
    common:
      skulpt_js:
        - '/js/skulpt/signal.js'
        - '/js/skulpt/wrapper.js'
    logClientCodeError: true
    logClientMetric: true
    draftDebounce: 1000
    autosaveDebounce: 1000
    enableLogin: true
    enableCopyRemix: true
  auth:
    google:
      clientSecret:
      clientID:
      callbackURL:
  serverside:
    # Maps trinket lang param to config key
    langmap:
      # python3 intentionally omitted: it runs on Pyodide (client-side), not a
      # server-side backend, so it must not resolve a serverside API URL.
      R: r3
      java: java8
      pygame: pygame
    # All server-side types go through nginx reverse proxy on port 8080
    # Python 3
    python3:
      api:
        default: 'http://localhost:8080/python3'
    # Java
    java8:
      api:
        default: 'http://localhost:8080/java'
    # R
    r3:
      api:
        default: 'http://localhost:8080/r'
    # Pygame
    pygame:
      api:
        default: 'http://localhost:8080/pygame'
  xframeDeny:
    - '/'
    - '/login'
    - '/signup'
    - '/contact'
    - '/educators'

  # Content-Security-Policy for /embed/* responses.
  #
  # Test mode (runMode=calculator) should be self-contained: what the student
  # sees is what the trinket contains, with nothing pulled in from outside.
  # Normal embeds stay permissive about images and media so existing course
  # material (remote textures) keeps working. Frames are disallowed in both.
  #
  # These policies reach the program itself: glowscript runs it in a `srcdoc`
  # iframe, which inherits the embedding page's policy, and the same policy
  # governs a blob: Web Worker (the pyodide worker runtime).
  #
  # {origin} is substituted with this deployment's own origin(s). It is not
  # redundant with 'self': the program runs in a sandboxed frame with an opaque
  # origin, and 'self' matches nothing there, so the frame could not load the
  # runtime libraries without naming the origin explicitly.
  #
  # cdnOrigins lists the third-party hosts the runtimes still need. Vendoring
  # them locally (build-resilience work) lets this list empty out, and the
  # policies tighten with no code change.
  csp:
    enabled: true
    # Scheme-less on purpose: the embed pulls several of these with
    # protocol-relative URLs, so they resolve to http on a local stack and
    # https in production. A host with no scheme matches both.
    cdnOrigins:
      - 'cdnjs.cloudflare.com'   # MathJax, jQuery, Modernizr, moment, highlight.js (+ their CSS)
      - 'cdn.jsdelivr.net'       # pyodide.js + wheels, fetched at runtime
    fontOrigins:
      - 'fonts.googleapis.com'   # the stylesheet
      - 'fonts.gstatic.com'      # the font files it references
    # Normal embeds: keep remote images/media so textures in existing course
    # material keep working. frame-src is 'none' even here — no program has a
    # reason to embed a frame.
    standard: >-
      default-src 'none'; script-src 'self' {origin} 'unsafe-inline' 'unsafe-eval' {cdn};
      style-src 'self' {origin} 'unsafe-inline' {cdn} {fonts}; img-src * data: blob:;
      media-src * data: blob:; font-src 'self' {origin} data: {cdn} {fonts}; connect-src * data: blob:;
      frame-src 'none'; child-src 'none'; worker-src 'self' {origin} blob:;
      object-src 'none'; base-uri 'none'; form-action 'none'
    # runMode=calculator (exam/test mode): no third-party content at all.
    # Deliberately breaks uploaded images and remote textures — during an exam
    # that is the point.
    exam: >-
      default-src 'none'; script-src 'self' {origin} 'unsafe-inline' 'unsafe-eval' {cdn};
      style-src 'self' {origin} 'unsafe-inline' {cdn} {fonts}; img-src 'self' {origin} data: blob:;
      media-src 'self' {origin} data: blob:; font-src 'self' {origin} data: {cdn} {fonts};
      connect-src 'self' {origin} {cdn}; frame-src 'none'; child-src 'none';
      worker-src 'self' {origin} blob:; object-src 'none'; base-uri 'none'; form-action 'none'
workers:
  trinkets:
    outputDir: '/tmp/' # should be readable by nginx
    templateUrl: 'http://127.0.0.1/tmp/' # should be an nginx alias pointing to outputDir
db:
  # Stock deployments use MongoDB via Mongoose. Firestore deployments override
  # this in their overlay (production-cloudrun.yaml already sets it).
  backend: mongoose
  firestore:
    projectId: ''   # Override in local.yaml or via GOOGLE_CLOUD_PROJECT env var
  mongo:
    host: localhost
    port: 27017
    database: trinket
    user:
    pass:
  mongoread:
    host:
    port: 27017
    database: trinket
    user:
    pass:
    opts: 'connectTimeoutMS=300000&socketTimeoutMS=300000'
  redis:
    app:
      host: localhost
      port: 6379
      pass:
    exports:
      host: localhost
      port: 6379
    bullqueues:
      - exports
    sandbox:
      host: localhost
      port: 6379
gcs:
  buckets:
    snapshots:
      # deploy-specific → set in config/local-production.yaml (placeholder default)
      name: 'your-snapshots-bucket'
      host: 'https://your-snapshots-bucket.example.com'

aws:
  key: ''
  keyId: ''
  region: us-east-1
  endpoint:          # internal S3 API endpoint the app talks to (e.g. http://garage:3900)
  publicEndpoint:    # browser-reachable S3 API endpoint for presigned download URLs
                     # (e.g. http://localhost:3900 dev; public Garage endpoint in prod).
                     # Required for export downloads under SigV4 (host is signed).
                     # Per-deployment: set via aws.publicEndpoint or $S3_PUBLIC_ENDPOINT.
  s3ForcePathStyle:
  signatureVersion:
  buckets:
    userassets:
      name: your-user-assets-bucket
      host: 'https://your-assets-bucket.example.com'
      thumbnail: 'thumb-%{s}'
      thumbnailHost: 'https://your-thumbnails-bucket.example.com'
      thumbnailBucket: your-thumbnails-bucket
    snapshots:
      name: your-snapshots-bucket
      host: 'https://your-snapshots-bucket.example.com'
    cdn:
      name: your-cdn-bucket
      host: 'https://your-cdn-bucket.example.com'
    materials:
      name: your-materials-bucket
      host: 'https://your-materials-bucket.example.com'
    useravatars:
      name: your-avatars-bucket
      host: 'https://your-avatars-bucket.example.com'
    appassets:
      name: your-app-assets-bucket
      host: 'https://your-app-assets.example.com'
    vendorassets:
      name: your-vendor-assets-bucket
      host: 'https://your-cdn.example.com'
  lambda:
    createThumbnail:
      secret: ''
  mail:
    keyId: ''
    key: ''
sandbox:
  # Mode: 'local' uses sandboxed srcdoc (simpler, no external service needed)
  #       'external' uses separate sandbox server (more secure, requires setup)
  mode: 'local'
  # Local mode settings (used when mode: 'local')
  local:
    # Sandbox permissions - do NOT add 'allow-same-origin' for security
    permissions: 'allow-scripts allow-forms allow-modals allow-popups'
  # External mode settings (used when mode: 'external')
  hostname: 0.0.0.0
  port: 3030
  cors:
    origin: # array of hosts to allow cross-domain requests
      - 'http://trinket.dev'
  expiration: 300 # 5 minutes
  contentSecurityPolicy: "default-src *; img-src * data:; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'"
  url:
    protocol: http
    domain: .trinket.dev
    serverSubdomain: sandbox
    port:
