storage:
  backend: s3   # s3 (aws-sdk) or gcs (@google-cloud/storage)

imports:
  largeUpload:
    enabled: true                 # per-deploy opt-out; false = direct POST only (small files)
    thresholdBytes: 26214400      # 25 MiB — client switch point (< 32 MiB ingress cap)
    maxArchiveBytes: 104857600    # 100 MiB — server ceiling enforced on from-storage

features:
  courses: true   # Enable/disable courses feature entirely
  assets: false   # Enable/disable asset uploads (requires S3 or compatible storage)
  accessibilityToggle: false  # Show accessibility toggle in embed toolbar (for screen reader mode)
  variableExplorer: false  # Show the Variables tab (namespace inspector) in Pyodide/Python3 trinkets
  stepDebugger: false  # "Step through" record & replay debugger in the Variables tab (requires variableExplorer)
  workerRuntime: false  # Run python3 programs in a Web Worker (#108) so the page cannot freeze and Stop always works. VPython stays on the main thread unless workerVPython (below) is also on. Per-trinket override: ?runtime=main / ?runtime=worker
  workerVPython: false  # Run Web VPython through vpython-jupyter in the Web Worker (#108 follow-on). Opt-in; ?runtime=main escapes. See docs/superpowers/specs/2026-08-10-vpython-jupyter-adoption-design.md
  mathOutput: false  # Typeset SymPy output (Jupyter-style) in the Pyodide console: bare top-level expressions and display() render via vendored KaTeX. See docs/superpowers/specs/2026-09-03-sympy-math-output-design.md
  requireAuthToFork: false  # Require login to fork/share a trinket; false = allow anonymous forks (trinket.io default)
  courseImport: true   # Show an "Import a Course" button on the home page. Instructor-only via canCreateCourse; deploys without an instructor concept render it hidden regardless of the flag.
  accessCodeEnrollment: false  # Self-service course join via access code (instructor mints a code, students enter it). Off by default; enable per-deploy for public/self-serve servers without LMS/SMTP. Gates the instructor UI, the student UI, AND the server endpoints together.
  trinkets:
    # Client-side languages - work out of the box
    python: false      # Skulpt-based Python 2/3 (disabled; superseded by pyodide, which is shown as "Python")
    pyodide: true      # Pyodide (real CPython via WASM, client-side, CDN-loaded) — labeled "Python" in the UI
    html: false        # HTML/CSS/JS
    blocks: false      # Block-based coding
    glowscript: true  # 3D graphics with GlowScript/VPython
    glowscript-blocks: false
    console: false     # Python console/REPL
    music: true       # EarSketch music coding
    # python3 now runs on Pyodide (client-side), not the :8080 backend — see
    # lib/views/embed/python3.html. Enabled so imported python3 trinkets work.
    python3: true      # Runs on Pyodide (no backend; was: requires Python 3 backend)
    # Server-side languages - require additional backend services
    java: false        # Requires Java backend
    pygame: false      # Requires Pygame backend
    R: false           # Requires R backend
  # Display labels for the New Trinket menu. base.html builds the menu from
  # features.trinkets.* (which entries show) and reads each entry's label here,
  # so labels are config-driven — never hardcoded. Per-deploy overlays override
  # individual labels (e.g. pyodide -> 'Python'); keys mirror features.trinkets.
  trinketLabels:
    python: 'Python'
    pyodide: 'Pyodide'
    python3: 'Python3'
    pygame: 'Pygame'
    java: 'Java'
    R: 'R'
    blocks: 'Blocks'
    html: 'HTML'
    glowscript: 'Web VPython'
    glowscript-blocks: 'Web VPython Blocks'
    music: 'Music'
  pyodideVersion: '0.28.1'  # Pyodide CDN version — single source of truth for bootstrap script and indexURL
  markdown:
    # Engine for NEWLY CREATED courses: legacy | modern. Existing courses keep
    # whatever they have (absent = legacy). See docs/superpowers/specs/
    # 2026-08-15-markdown-engine-bridge-design.md.
    #
    # Ships as `legacy` on purpose: the modern engine arrives as a per-course
    # option instructors can opt into, so nothing changes for anyone until they
    # choose it. Deployments that want the modern engine for new courses can set
    # this to `modern`; the decision about a global default belongs with the
    # evidence from real adoption, not with this PR.
    newCourseDefault: legacy

auth:
  # Auth provider — a deployment uses exactly ONE ('local' or 'firebase').
  # 'local' = stock email/password (login form, bcrypt, forgot-pass flow).
  # 'firebase' = FirebaseUI + Google OAuth; set in the deploy overlay along
  # with the firebase client config below. See config/auth_routes.js.
  provider: local
  # Emails that bypass the instructor/roster check and have full admin access
  adminEmails: []
  # Approval-tier profile (instructor-run deployments). When true, forking/creating
  # trinkets requires an approved account (user.approved) or site admin; when false
  # (default) any authenticated user passes — stock behavior.
  requireApprovedAccount: false
  # When true, restrict course create/copy/import to site admins and approved
  # instructors (user.isInstructor). Default false: any authenticated user may
  # create courses — stock behavior.
  restrictCourseCreation: false
  firebase:
    # Sign-in methods FirebaseUI shows, in order. Keep in sync with the
    # providers actually enabled in the Firebase console — the app cannot
    # auto-discover them. Supported: 'google', 'password'. Override per deploy
    # (e.g. ['google'] for a Google-only deployment).
    providers: ['google', 'password']
    projectId: ''   # Your GCP/Firebase project ID — override in local.yaml
    clientConfig:   # Firebase web SDK config from Project Settings > Your apps
      apiKey: ''
      authDomain: ''
      projectId: ''
      storageBucket: ''
      messagingSenderId: ''
      appId: ''

lti:
  # Display name this deployment registers under in the LMS (client_name -> the
  # Developer Keys / Apps entry name). Set per deploy in the production overlay so
  # multiple Trinket servers in one LMS are distinguishable (e.g. 'UIndy Trinket',
  # 'M&I Trinket'). Defaults to 'Trinket'.
  toolName: 'Trinket'

app:
  siteName: 'Trinket'
  # Landing-page branding text (lib/views/index.html). Per-deploy overrides go
  # in config/local-production.yaml.
  branding:
    lead: 'Trinket is an open source browser-based coding platform.'
    subtitle: 'Write and run Python, HTML, Java, and more. Create interactive courses. No downloads required.'
    instructorHeading: 'For Educators'
  # Per-deploy brand theming. These values are injected as CSS custom properties
  # in lib/views/base.html (:root { --brand-* }) and consumed by the SCSS via
  # var(--brand-*, <fallback>). The defaults below are the current PICUP palette,
  # so the site looks identical out of the box. Each institution can override
  # these in config/local-production.yaml (or config/local.yaml) without forking
  # the shared SCSS. Leave a value blank to fall back to the SCSS default.
  theme:
    # White, not the old #F4F3F3 grey: course pages are built by pasting images
    # into markdown, and any screenshot without a transparent background showed
    # a visible white card on the grey page.
    pageBg: '#FFFFFF'    # page (body) background
    heading: '#006400'   # h1/h2/h3 heading color  (was $picup-dark-green)
    navItem: '#E0E6C6'   # nav dropdown item background (was $picup-nav-item)
    primary: '#75BF48'   # display brand color: hero banner and other large fills (was $picup-green)
    # Text-bearing brand color. The display green above is only 2.04:1 against
    # the page and 2.26:1 under white button text; WCAG AA wants 4.5:1 for body
    # text. This darker green measures 5.13:1 in both roles.
    link: '#2E7D32'      # anchor color
    button: '#2E7D32'    # filled primary/success button background (white label text)
    # --- #149: optional derived-shade keys, NO defaults on purpose. When unset,
    # every use falls back (in the compiled CSS) to the exact Sass-computed
    # stock shade, so leaving these out changes nothing. A branded deploy that
    # sets link/button/primary/secondary should usually set these too:
    #   buttonDark:    hover/border shade of `button`  (stock: darken(green,10%))
    #   buttonPale:    pale hover/disabled fill        (stock: lighten(green,40%))
    #   secondary:     the second accent (completed-status, secondary buttons;
    #                  stock: dark green #006400)
    #   secondaryDark: hover shade of `secondary`
    #   secondaryPale: pale fill of `secondary`
  siteUrl: ''
  supportEmail: ''
  adminEmail: ''
  logo: '/img/trinket-logo.png'
  # Compact mark used where the wide logo above doesn't fit — notably the EMBED
  # header at medium-down widths (lib/views/embed/base.html), which is what an
  # embedded trinket box in course text actually is.
  #
  # ⚠️ A deploy that overrides `logo` must override `logoIcon` TOO. Overriding
  # only `logo` leaves this stock Trinket mark in every small embed while the
  # branded logo appears in full screen — reported as "the icon defaults to the
  # Trinket.io logo, but full screen shows the correct branded icon" (issue #47).
  logoIcon: '/img/trinket-logo-circles.png'
  hostname: 0.0.0.0
  port: 3000
  url:
    protocol: https
    hostname: trinket.dev
    # Extra hostnames this deploy also answers on (CDN front door, alternate
    # domains). Used to validate X-Forwarded-Host (lib/util/publicHostname.js)
    # and for embed-URL rewriting; hostnames only, no scheme or port.
    knownHosts: []
    port:
  start: true
  usersubdomains: false
  templates: lib/views/
  staticPages: static
  plugins:
    session:
      cookieOptions:
        password: '' # cookie secret - set in local.yaml
        isSecure: false # required for non-https applications
        domain: .trinket.dev
      maxCookieSize: 0 # ensures sessions are stored server-side
      name: session # same as default but adding for cookie updates
      cache:
        cache: 'sessions'
        expiresIn: 2147483647 # 32-bit restrictions and/or fixed with catbox upgrade
    travelogue:
      urls:
        failureRedirect: '/login'
        successRedirect: '/welcome'
        excludePaths:
          - js
          - css
          - fonts
          - img
          - partials
  assets:
    jshead:
      - '//cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js'
      - '/components/dist/lodash.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/angular.js/1.3.20/angular.min.js'
      - '/js/trinket.js'
      - '/js/trinket-config.js'
      - '/js/trinket-roles.js'
      - '/js/util/template.js'
    jsbody:
      - '//cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js'
      - '//ajax.googleapis.com/ajax/libs/angularjs/1.3.20/angular-route.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/restangular/1.3.1/restangular.min.js'
      - '/components/marked/lib/marked.js'
      - '//cdnjs.cloudflare.com/ajax/libs/highlight.js/8.0/highlight.min.js'
      - '/components/src-min-noconflict/ace.js'
      # Ace markdown mode + github theme for the course-page editor. The bundled
      # src-min-noconflict/ set (public-components.tgz) ships only the trinket
      # language modes, so Ace 404s lazy-loading these two from that dir. Preload
      # them from a version-matched CDN (bundled Ace is v1.4.14) so the course
      # markdown editor gets highlighting + theme (see issue #23).
      - '//cdnjs.cloudflare.com/ajax/libs/ace/1.4.14/mode-markdown.min.js'
      - '//cdnjs.cloudflare.com/ajax/libs/ace/1.4.14/theme-github.min.js'
      - '/components/foundation/js/foundation.min.js'
      - '/partials/directives/flash.js'
      - '/partials/directives/trinket.js'
      - '//cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/aes.js'
      - '/js/services/roles.js'
      - '/partials/directives/join-course.js'
      - '/partials/directives/courses.js'
      - '/js/util/cache.js'
      - '/js/debug.js'
      - '/js/util/ng-text-select.js'
      - '/js/util/text-select.js'
      - '/js/trinket-share.js'
      - '//cdnjs.cloudflare.com/ajax/libs/notify/0.4.2/notify.min.js'
      - '//ajax.googleapis.com/ajax/libs/angularjs/1.3.20/angular-aria.min.js'
    css:
      - '//cdnjs.cloudflare.com/ajax/libs/highlight.js/8.0/styles/github.min.css'
      - '//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'
      - '//cdnjs.cloudflare.com/ajax/libs/video.js/5.20.4/video-js.min.css'
      - '/css/base.css'
