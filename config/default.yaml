    'font-mfizz': '2.0.1'
    'gsap': '1.15.0'
    'jquery-ui': 'https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1'
    'jsdiff': '1.0.8'
    'jszip': '3.1.4'
    'jszip-utils': 'dist'
    'lazysizes': '1.5.0'
    'lodash': '2.4.1'
    'modernizr': '2.7.2'
    'ng-file-upload': '1.2.6'
    'ngInfiniteScroll': '1.1.2'
    'notifyjs': '0.4.2'
    'restangular': '1.3.1'
    'speakingurl': '1.1.5'
    'video.js': '5.20.4'
    'yamljs': '0.1.5'
  recaptcha:
    sitekey: ''
    secretkey: ''
  log:
    level: info
    debug:
      filename: '/tmp/debug.txt'
      files: true
      unauth: true
      routehandlertiming: true
  mail:
    # SMTP settings for sending email (password reset, notifications, etc.)
    from: ''      # sender address, e.g. noreply@example.com
    host: ''      # SMTP host, e.g. smtp.example.com
    port: 587     # SMTP port (587 for TLS, 465 for SSL, 25 for unencrypted)
    user: ''      # SMTP username
    pass: ''      # SMTP password
    secure: false # true for port 465, false for other ports
  # Static-asset caching. Off by default: turning it on tells browsers and any
  # shared cache to keep version-stamped assets, which is only safe because the
  # stamp rolls on deploy. Dynamic responses stay no-store either way.
  cache:
    enabled: false
    staticMaxAge: 31536000   # 1 year; the URL changes on deploy, so this is safe
  cachePrefix: cache-prefix-
  prefixes: # static routes
    components:
    js:
    css:
    img:
    fonts:
    partials:
    skulpt:
    models:
  ngapps:
    main:
      - '/components/ng-file-upload.min.js'
