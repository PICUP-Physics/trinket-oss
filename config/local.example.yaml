# Trinket Local Configuration
# Copy this file to local.yaml: cp config/local.example.yaml config/local.yaml
# IMPORTANT: Never commit local.yaml to version control

# =============================================================================
# REQUIRED
# =============================================================================

app:
  url:
    protocol: http
    hostname: localhost
    port: 3000

  plugins:
    session:
      cookieOptions:
        # CHANGE THIS - must be at least 32 characters
        password: 'change-this-to-a-secure-password-min-32-chars!'
        domain: ''
        isSecure: false  # Set true in production with HTTPS

# =============================================================================
# DATABASE
# =============================================================================

db:
  mongo:
    host: mongodb      # Use 'mongodb' for Docker, 'localhost' for local
    port: 27017
    database: trinket

  # Redis is OPTIONAL - sessions work without it
  redis:
    enabled: false

# =============================================================================
# OPTIONAL: Email (for password reset)
# =============================================================================
# Without email, users can still register and log in, but password reset won't work.
# A failed send of a password reset, email verification, email change confirmation, share by email,
# course invitation or admin session alert is logged as one "MAIL_SEND_FAILED type=... to=... message=..."
# line in the app log (addresses in it, including any in the mail server's reply, appear as tokens
# unless ferpa.logEmails is full; see the FERPA section below); grep for it if
# mail is not arriving. Most of these flows answer the user before
# sending, so a failure is invisible to them (share by email is the exception: its request never completes).
# Export-ready and export-failed notifications are NOT covered: a failure there surfaces through the export
# job's failure handling, not this line. Mailgun sandbox domains only deliver to authorized recipients.

# app:
#   mail:
#     from: 'noreply@example.com'
#     host: 'smtp.example.com'
#     port: 587
#     user: 'your-smtp-username'
#     pass: 'your-smtp-password'

# =============================================================================
# OPTIONAL: FERPA / student privacy
# =============================================================================
# Server logs show student email addresses as tokens by default: student@cnu.edu
# appears as u-3f9a2c1d@cnu.edu, the same token every time for the same address.
# To find one student's log lines, print their token and grep for it. Run this
# where the app runs, from the repository root, so it uses the app's key:
#   docker compose exec app node scripts/log-email-token.js student@cnu.edu
#   node scripts/log-email-token.js student@cnu.edu      (installs without Docker)
# On a host with no exec into the app (e.g. Cloud Run), run it from a checkout of the
# same version with FERPA_LOG_TOKEN_SECRET set to the production value. Tokens are
# short (8 hex characters), so confirm a match by time and user id.
# Set logTokenSecret once (32+ random characters, e.g. from `openssl rand -hex 32`)
# and do not change it: older log lines can only be looked up with the key they
# were written with. With Docker, set it here in local.yaml: the stock
# docker-compose.yml does not pass FERPA_LOG_TOKEN_SECRET into the container;
# deployments that inject secrets as environment variables (e.g. Cloud Run) can
# use FERPA_LOG_TOKEN_SECRET instead. Without a key, tokens follow the session
# cookie password above and change whenever that is rotated. If you kept the
# example session password above, change it: anyone can read it in this file.

# ferpa:
#   logEmails: token          # or: full (log addresses as written)
#   logTokenSecret: ''        # 32+ random characters

# Other settings that affect student data (pointers only; set them in their own
# sections). Checked against the code on 2026-10-15:
#   app.log.debug.filename              lines written through the app's logger (including
#                                       debug-level ones the console omits, and request and
#                                       response dumps) go to this file, unbounded and
#                                       unrotated; set it to '' to turn it off. console.*
#                                       output (MAIL_SEND_FAILED, LOGIN lines) is not in it
#   app.log.debug.routehandlertiming    on by default: every request taking over 10 ms logs
#                                       the session id, path and (when signed in) user id,
#                                       to the console and the debug file; requests still
#                                       running after 1 s are logged the same way even when
#                                       it is off
#   app.mail.*                          your SMTP provider receives recipient addresses
#                                       and message bodies (a sub-processor)
#   app.adminEmail                      if set, session alerts (usernames, page URLs) are
#                                       emailed to it; leave it empty unless you need them
#   app.recaptcha.*                     with a site key, Google sees visitor IP and browser
#                                       details on every page
#   auth.provider, auth.firebase.*      'firebase' makes Google the identity provider
#   db.backend, db.firestore.projectId  where student records live
#   storage.backend, aws.buckets.*      student uploads and work exports; the app never
#                                       deletes export archives, so set a bucket lifecycle rule
#   app.embed.logClientCodeError        stores a student's code when it errors (400-day TTL
#                                       on MongoDB; the Firestore TTL declared in
#                                       firestore.indexes.json is on the creation time, see
#                                       the assessment, section 2.7)
#   app.embed.logClientMetric           stores user id, IP address and browser (no expiry)
#   app.assets.*, app.csp.*, features.pyodideVersion
#                                       third-party CDNs see visitor IP and referrer;
#                                       self-host the files to avoid that
# Not configurable today (session lifetime, export link expiry, LTI identity claims,
# usernames and IP addresses in some log lines): see
# docs/compliance/ferpa-data-privacy-assessment.md, section 2.7.

# =============================================================================
# OPTIONAL: File Storage (for asset uploads in trinkets)
# =============================================================================
# Without S3, the asset upload feature is disabled. Code still works fine.

# features:
#   assets: true
#
# aws:
#   keyId: 'your-access-key-id'
#   key: 'your-secret-key'
#   region: 'us-east-1'
#   # For S3-compatible storage such as Garage:
#   # endpoint: 'http://garage:3900'
#   # s3ForcePathStyle: true
#   # signatureVersion: 'v4'
#   buckets:
#     userassets:
#       name: 'your-bucket-name'
#       host: 'https://your-bucket.s3.amazonaws.com'

# Docker Compose includes a local Garage service for S3-compatible storage.
# The app container is configured with NODE_CONFIG in docker-compose.yml. If you
# run Trinket outside Docker and still want to use that Garage service, use:
#
# features:
#   assets: true
#
# aws:
#   keyId: 'trinket-dev-key'
#   key: 'trinket-dev-secret-key'
#   region: 'garage'
#   endpoint: 'http://localhost:3900'
#   s3ForcePathStyle: true
#   signatureVersion: 'v4'
#   buckets:
#     userassets:
#       name: 'trinket-userassets'
#       host: 'http://trinket-userassets.localhost:3902'
#       thumbnail: 'thumb-%{s}'
#       thumbnailHost: 'http://trinket-userassets.localhost:3902'
#       thumbnailBucket: 'trinket-userassets'
#     snapshots:
#       name: 'trinket-snapshots'
#       host: 'http://trinket-snapshots.localhost:3902'
#     materials:
#       name: 'trinket-materials'
#       host: 'http://trinket-materials.localhost:3902'
#     useravatars:
#       name: 'trinket-useravatars'
#       host: 'http://trinket-useravatars.localhost:3902'
#     exports:
#       name: 'trinket-exports'
#       host: 'http://trinket-exports.localhost:3902'

