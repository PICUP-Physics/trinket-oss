services:
  firebase:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    container_name: trinket-emulators
    volumes:
      - .:/app
      - firebase_cache:/root/.cache/firebase
    command: firebase emulators:start --only auth,firestore,storage --project demo-trinket
    ports:
      - "4000:4000"   # Emulator UI
      # Firestore is published 1:1 — the Emulator UI's Firestore tab connects
      # from the BROWSER to 127.0.0.1:8080 (per firebase.json) and to the
      # request-monitor websocket on 9150, so both must be reachable on the
      # host. (The old 8088 remap dodged the local Canvas testbed, which now
      # lives at canvas.spvi.net instead — the UI tab was blank under it.)
      - "8080:8080"   # Firestore
      - "9150:9150"   # Emulator UI firestore-requests websocket
      - "9099:9099"   # Auth
      - "9199:9199"   # Storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    build: .
    # No platform pin: build host-native (arm64 on Apple Silicon, amd64 on Intel
    # hosts and CI). A hard-coded linux/arm64 forced QEMU on amd64 boxes and the
    # app timed out reaching the Firestore emulator on boot. Set
    # DOCKER_DEFAULT_PLATFORM=linux/amd64 if you deliberately want Cloud-Run parity.
    image: trinket-gcr/app:latest
    ports:
      - 3001:3000
    container_name: trinket-gcr
    command: node app.js
    depends_on:
      firebase:
        condition: service_healthy
    volumes:
      - .:/usr/local/node/trinket
      - /usr/local/node/trinket/node_modules
      - /usr/local/node/trinket/public/css
      - /usr/local/node/trinket/public/components
    environment:
      NODE_ENV: development
      # Optional per-deploy overlay folder (deploys/<name>; see config/deploy-dir.js).
      # The emulator NODE_CONFIG below still governs the backend; the overlay
      # supplies branding/features/announcement so `make gcp` can preview a deploy.
      TRINKET_DEPLOY: "${TRINKET_DEPLOY:-}"
      GOOGLE_CLOUD_PROJECT: demo-trinket
      FIRESTORE_EMULATOR_HOST: firebase:8080
      STORAGE_EMULATOR_HOST: http://firebase:9199
      STORAGE_PUBLIC_HOST: http://localhost:9199
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      FIREBASE_CLIENT_CONFIG: ${FIREBASE_CLIENT_CONFIG}
      LTI_PRIVATE_KEY: ${LTI_PRIVATE_KEY}
      # features.mathOutput is on here (alongside assets) because
      # test/browser/specs/math-output.spec.js asserts the typeset SymPy
      # behaviour unconditionally — unlike variableExplorer/workerRuntime, which
      # specs read off window.trinket.config and test.skip when a dev's own
      # untracked config/local.yaml hasn't turned them on. NODE_CONFIG has the
      # highest precedence in node-config's merge order, so this wins over
      # default.yaml (mathOutput: false) for every box that runs `make gcp`,
      # Larry's included, with no config/local.yaml change needed.
      NODE_CONFIG: >-
        {"app":{"url":{"hostname":"${LTI_PUBLIC_HOST:-localhost}","protocol":"${LTI_PUBLIC_PROTO:-http}","port":${LTI_PUBLIC_PORT:-3001}},"plugins":{"session":{"cache":{"backend":"memory"}}},"auth":{"google":{"callbackURL":"http://localhost:3001/auth/google/callback"}}},"auth":{"provider":"firebase"},"db":{"backend":"firestore","firestore":{"projectId":"demo-trinket"},"redis":{"enabled":false}},"storage":{"backend":"gcs"},"features":{"assets":true,"mathOutput":true},"aws":{"buckets":{"materials":{"name":"demo-trinket.appspot.com","host":"http://localhost:9199/demo-trinket.appspot.com"},"userassets":{"name":"demo-trinket.appspot.com","host":"http://localhost:9199/demo-trinket.appspot.com"},"useravatars":{"name":"demo-trinket.appspot.com","host":"http://localhost:9199/demo-trinket.appspot.com"},"snapshots":{"name":"demo-trinket.appspot.com","host":"http://localhost:9199/demo-trinket.appspot.com"}}}}

volumes:
  firebase_cache:
